# ═══════════════════════════════════════════════════════════════
# GitLab CI — quality gates for every merge request
#
# Ports the intent of .github/workflows/ (which never ran: the remote
# is GitLab, not GitHub). Stages:
#   lint      — ruff check + format on files changed in the MR
#   validate  — control-library catalog validation, Dockerfile parse check
#   test      — policy_loader unit tests
#   synth     — cdk synth with placeholder account (no AWS credentials)
#   terraform — fmt + validate for org-guardrails
#
# Note: ruff lints CHANGED files only — a pre-existing backlog of ~113
# findings across the repo is tracked separately (Asana: "Clean FAST
# tracker false claims + lint backlog"). New/modified code must be clean.
# ═══════════════════════════════════════════════════════════════

stages: [lint, validate, test, synth, terraform]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

default:
  image: public.ecr.aws/docker/library/python:3.13-slim
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

.pip-cache: &pip-cache
  cache:
    key: pip-$CI_JOB_NAME
    paths: [.cache/pip]

ruff:
  stage: lint
  <<: *pip-cache
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - pip install -q ruff
  script:
    # Diff against the MR target branch (or previous commit on main)
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      else
        BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
      fi
      CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.py' || true)
      if [ -z "$CHANGED" ]; then
        echo "No Python files changed — skipping lint."
        exit 0
      fi
      echo "Linting changed files:"; echo "$CHANGED"
      # shellcheck disable=SC2086
      ruff check $CHANGED
      ruff format --check $CHANGED
  variables:
    GIT_DEPTH: "0"

control-library:
  stage: validate
  <<: *pip-cache
  before_script:
    - pip install -q pyyaml checkov
  script:
    - python scripts/validate_control_library.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - control-library/**/*
        - infra_utils/policy_loader.py
        - scripts/validate_control_library.py
        - tests/**/*
        - terraform/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"

dockerfile-parse:
  stage: validate
  variables:
    HADOLINT_VERSION: "2.14.0"
    HADOLINT_SHA256: "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47"
  before_script:
    # hadolint has no image on public.ecr.aws — install the pinned static
    # binary from GitHub releases and verify its published checksum.
    - apt-get update -qq && apt-get install -y -qq curl > /dev/null
    - curl -sL -o /usr/local/bin/hadolint
        "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
    - echo "${HADOLINT_SHA256}  /usr/local/bin/hadolint" | sha256sum -c -
    - chmod +x /usr/local/bin/hadolint
  script:
    # Syntax + best-practice check on every agent Dockerfile.
    # DL3008/DL3013/DL3016 (unpinned apt/pip/npm) are warnings for now —
    # pinning is tracked as a separate task.
    - hadolint --failure-threshold error
        --ignore DL3008 --ignore DL3013 --ignore DL3016
        agent-code/*/Dockerfile
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - agent-code/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"

pytest:
  stage: test
  <<: *pip-cache
  before_script:
    # boto3 + colorama: imported by scripts/utils.py, which the scripts tests import
    - pip install -q pyyaml pytest boto3 colorama
  script:
    - python -m pytest tests/ -q

cdk-synth:
  stage: synth
  image: public.ecr.aws/docker/library/node:22-slim
  <<: *pip-cache
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv > /dev/null
    - python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt
  script:
    # Synth with a placeholder account — validates all stacks assemble
    # without AWS credentials. Docker asset bundling is not exercised.
    - CDK_DEFAULT_ACCOUNT=111111111111 CDK_DEFAULT_REGION=us-east-1
      npx --yes cdk synth --app ".venv/bin/python3 app.py" --quiet
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - app.py
        - cdk.json
        - requirements.txt
        - stacks/**/*
        - infra_utils/**/*
        - control-library/**/*
        - agent-code/**/*
        - tools/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"

terraform:
  stage: terraform
  image:
    name: public.ecr.aws/hashicorp/terraform:1.9
    entrypoint: [""]
  script:
    - terraform fmt -check -recursive terraform/
    - terraform -chdir=terraform/org-guardrails init -backend=false -input=false
    - terraform -chdir=terraform/org-guardrails validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - terraform/**/*
        - control-library/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"
