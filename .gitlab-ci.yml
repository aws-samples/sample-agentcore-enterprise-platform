# Adapted from fullstack-solution-template-for-agentcore
# GitLab CI/CD for AgentCore Workshop CDK

image: public.ecr.aws/docker/library/python:3.13-bookworm

stages:
  - test
  - deploy

lint:
  stage: test
  before_script:
    - pip install ruff
  script:
    - ruff check . --select E,F,I --ignore E501
