# Adapted from fullstack-solution-template-for-agentcore
services:
  orchestrator:
    build:
      context: ..
      dockerfile: agent-code/orchestrator/Dockerfile
      platforms:
        - linux/arm64
    ports:
      - "8080:8080"
    environment:
      - MEMORY_ID=${MEMORY_ID}
      - PROJECT_NAME=${PROJECT_NAME:-agentcore-workshop}
      - ENVIRONMENT=${ENVIRONMENT:-dev}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_REGION=${AWS_DEFAULT_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ping', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - workshop-network

networks:
  workshop-network:
    driver: bridge
