name: Documentation Integrity

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  docs-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Check local links, navigation, and site assets
        run: python scripts/check_docs.py

      - name: Check repository capability boundaries
        run: python scripts/check_repository_structure.py
