name: Factory CDK

# Synth and tests only. This workflow holds no AWS credentials and requests no id-token:
# the factory is deployed from an operator workstation, never from GitHub.

on:
  pull_request:
    paths:
      - 'factory/**'
      - 'requirements.txt'
      - '.github/workflows/factory-cdk.yml'
  push:
    branches: [factory/main-v2]
    paths:
      - 'factory/**'
      - 'requirements.txt'
      - '.github/workflows/factory-cdk.yml'

permissions:
  contents: read

concurrency:
  group: factory-cdk-${{ github.ref }}
  cancel-in-progress: true

env:
  CDK_CLI_VERSION: '2.1149.0'
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'

jobs:
  check:
    name: synth and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install CDK CLI and dependencies
        run: |
          npm install -g "aws-cdk@${CDK_CLI_VERSION}"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt -r factory/agent-code/requirements.txt pytest

      # Placeholder account and gids: the synth proves the app builds, without real values.
      - name: Synth (CDK CLI reads the app manifest)
        working-directory: factory/infra
        env:
          CDK_DEFAULT_ACCOUNT: '111111111111'
          CDK_DEFAULT_REGION: us-east-1
        run: ./preflight.sh -c coordinator_role=operator -c asana_project=100000000001 -c asana_users=100000000002

      - name: Tests
        run: |
          python -m pytest factory/infra/tests -q
          (cd factory/agent-code && python -m pytest -q)
          python -m pytest factory/sync -q
