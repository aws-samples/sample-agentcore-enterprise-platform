# Adapted from fullstack-solution-template-for-agentcore
name: Python Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      # Pinned so a new ruff release (new default rules) cannot turn main red
      # overnight; bump deliberately and fix what it reports in the same PR.
      - name: Install ruff
        run: pip install ruff==0.17.6

      # Whole repository, so findings in files a PR does not touch cannot pile up.
      - name: Run ruff check
        run: ruff check --output-format=github .

      - name: Run ruff format check
        run: ruff format --check .
