# Adapted from fullstack-solution-template-for-agentcore
name: Python Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get changed Python files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **/*.py

      - name: Set up Python
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install ruff
        if: steps.changed-files.outputs.any_changed == 'true'
        run: pip install ruff

      - name: Run ruff check on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          echo "Checking changed Python files:"
          echo "${ALL_CHANGED_FILES}" | tr ' ' '\n'
          ruff check --output-format=github ${ALL_CHANGED_FILES}

      - name: Run ruff format check on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: ruff format --check ${ALL_CHANGED_FILES}

      - name: Skip message
        if: steps.changed-files.outputs.any_changed == 'false'
        run: echo "No Python files changed - skipping linting"
