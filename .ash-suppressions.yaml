# Accepted ASH findings. Each entry needs rule_id, path and reason (see docs/TESTING.md).
suppressions:
  - rule_id: "SECRET-HEX-HIGH-ENTROPY-STRING"
    path: ".github/workflows/secret-boundary.yml"
    reason: "SHA-256 checksum of the pinned gitleaks download, not a secret"
    expiration: "2027-05-31"
  - rule_id: "SECRET-HEX-HIGH-ENTROPY-STRING"
    path: ".gitlab-ci.yml"
    reason: "SHA-256 checksum of the pinned hadolint download, not a secret"
    expiration: "2027-05-31"
  - rule_id: "zizmor/dangerous-triggers"
    path: ".github/workflows/ash-security-comment.yml"
    reason: "workflow_run is required to comment on fork PRs; the artifact is treated as untrusted data (docs/TESTING.md, comment workflow trust model)"
    expiration: "2027-05-31"
  # detect-secrets flags any line that mentions "secret" next to a string. The PR scan
  # scans whole changed files, so these pre-existing false positives fail every PR that
  # touches the files. Gitleaks (secret-boundary.yml) remains the secret gate for them.
  - rule_id: "SECRET-SECRET-KEYWORD"
    path: "tests/**"
    reason: "test fixtures use secret NAMES and sentinel values that tests assert never leak"
    expiration: "2027-05-31"
  - rule_id: "SECRET-JSON-WEB-TOKEN"
    path: "tests/test_placeholders.py"
    reason: "a dummy unsigned JWT the placeholder check must reject as a secret name"
    expiration: "2027-05-31"
  - rule_id: "SECRET-BASE64-HIGH-ENTROPY-STRING"
    path: "tests/test_placeholders.py"
    reason: "the same dummy JWT's base64 segments"
    expiration: "2027-05-31"
  - rule_id: "SECRET-SECRET-KEYWORD"
    path: "scripts/check-deploy-config.sh"
    reason: "shell test of deploy.sh config handling; dummy secret names and sentinel values"
    expiration: "2027-05-31"
  - rule_id: "SECRET-BASE64-HIGH-ENTROPY-STRING"
    path: "scripts/check-deploy-config.sh"
    reason: "secret-name strings in the shell test (e.g. mig-check/dev/migration/JIRA_TOKEN)"
    expiration: "2027-05-31"
  - rule_id: "SECRET-SECRET-KEYWORD"
    path: "scripts/gen_platform_reference.py"
    reason: "descriptions and env-var names of *_secret_name fields in the generated reference"
    expiration: "2027-05-31"
  - rule_id: "SECRET-SECRET-KEYWORD"
    path: "infra_utils/platform_config.py"
    reason: "credential-provider type names and *_secret_name field names, no values"
    expiration: "2027-05-31"
